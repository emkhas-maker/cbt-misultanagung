<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT MI Sultan Agung</title>

<!-- Fonts: Plus Jakarta Sans (display/heading) + Inter (body) + JetBrains Mono (data/ID) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<!-- Tailwind (dibuild lokal ke assets/css/tailwind.min.css — tidak bergantung pada CDN eksternal) -->
<link rel="stylesheet" href="assets/css/tailwind.min.css">

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-canvas text-ink font-body antialiased">

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="view-login" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
      <div class="pattern-band mb-6"></div>
      <div class="text-center mb-8">
        <p class="text-xs font-semibold tracking-widest text-teal-600 uppercase mb-1">MI Sultan Agung</p>
        <h1 class="font-display font-extrabold text-2xl text-ink">Sistem CBT</h1>
        <p class="text-sm text-ink/60 mt-1">Masuk untuk mengelola atau mengerjakan ujian</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-black/5 p-6">
        <div class="flex gap-1 bg-teal-50 rounded-lg p-1 mb-6" role="tablist">
          <button data-login-tab="admin" class="login-tab flex-1 text-sm font-semibold py-2 rounded-md transition" aria-selected="true">Panitia / Admin</button>
          <button data-login-tab="siswa" class="login-tab flex-1 text-sm font-semibold py-2 rounded-md transition" aria-selected="false">Siswa</button>
        </div>

        <!-- Form Admin -->
        <form id="form-login-admin" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-ink/70 mb-1.5" for="admin-password">Kata Sandi Panitia</label>
            <input id="admin-password" type="password" autocomplete="current-password"
              class="w-full rounded-lg border border-black/10 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400"
              placeholder="••••••••">
          </div>
          <p id="admin-login-error" class="text-xs text-brick-500 hidden"></p>
          <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-2.5 rounded-lg transition">
            Masuk sebagai Admin
          </button>
        </form>

        <!-- Form Siswa -->
        <form id="form-login-siswa" class="space-y-4 hidden">
          <div>
            <label class="block text-xs font-semibold text-ink/70 mb-1.5" for="siswa-nisn">NISN</label>
            <input id="siswa-nisn" type="text" inputmode="numeric" autocomplete="off"
              class="w-full rounded-lg border border-black/10 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400"
              placeholder="Sesuai Kartu Peserta">
          </div>
          <div>
            <label class="block text-xs font-semibold text-ink/70 mb-1.5" for="siswa-token">Token Ujian</label>
            <input id="siswa-token" type="text" autocomplete="off"
              class="w-full rounded-lg border border-black/10 px-3.5 py-2.5 text-sm font-mono tracking-widest uppercase focus:outline-none focus:ring-2 focus:ring-teal-400 focus:border-teal-400"
              placeholder="XXXXXX" maxlength="6">
          </div>
          <p id="siswa-login-error" class="text-xs text-brick-500 hidden"></p>
          <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-2.5 rounded-lg transition">
            Mulai Ujian
          </button>
        </form>
      </div>

      <p class="text-center text-xs text-ink/40 mt-6">© <span id="tahun-footer"></span> MI Sultan Agung — Sistem CBT Internal</p>
    </div>
  </div>

  <!-- ============ ADMIN SHELL ============ -->
  <div id="view-admin" class="hidden min-h-screen md:flex">

    <!-- Sidebar -->
    <aside class="md:w-64 shrink-0 bg-teal-700 text-white flex md:flex-col">
      <div class="hidden md:block">
        <div class="px-6 pt-6 pb-5">
          <p class="text-[11px] font-semibold tracking-widest text-teal-100/70 uppercase">MI Sultan Agung</p>
          <p class="font-display font-bold text-lg leading-tight mt-0.5">Sistem CBT</p>
        </div>
        <div class="pattern-band-dark mx-6 mb-4"></div>
      </div>

      <nav class="flex md:flex-col gap-1 px-2 md:px-3 py-2 md:py-0 overflow-x-auto md:overflow-visible w-full">
        <!-- data-route diisi otomatis oleh app.js sesuai daftar ROUTES -->
      </nav>

      <div class="hidden md:block mt-auto px-6 py-5 border-t border-white/10">
        <p class="text-xs text-teal-100/70 mb-2">Masuk sebagai</p>
        <p class="text-sm font-semibold">Panitia / Admin</p>
        <button id="btn-logout-admin" class="text-xs text-teal-100/70 hover:text-white mt-2 underline underline-offset-2">Keluar</button>
      </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 min-w-0">
      <header class="bg-white border-b border-black/5 px-5 md:px-8 py-4 flex items-center justify-between">
        <div>
          <h2 id="page-title" class="font-display font-bold text-lg text-ink">Dashboard</h2>
          <p id="page-subtitle" class="text-xs text-ink/50 mt-0.5">Ringkasan sistem CBT</p>
        </div>
        <div class="flex items-center gap-2 md:hidden">
          <button id="btn-logout-admin-mobile" class="text-xs text-brick-500 font-semibold">Keluar</button>
        </div>
      </header>

      <main id="app-content" class="p-5 md:p-8">
        <!-- Konten tiap menu dirender di sini oleh app.js -->
      </main>
    </div>
  </div>

  <!-- ============ SISWA — SHELL UJIAN ============ -->
  <!-- Konten dirender sepenuhnya oleh ujian.js (UjianModule) setelah login berhasil -->
  <div id="view-siswa" class="hidden"></div>

  <!-- Container khusus cetak (Kartu Peserta, Daftar Hadir, Berita Acara) -->
  <!-- Kosong & tersembunyi secara normal, cuma tampil saat window.print() -->
  <div id="print-container"></div>

  <script src="assets/vendor/xlsx.full.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/siswa.js"></script>
  <script src="assets/js/soal.js"></script>
  <script src="assets/js/materi.js"></script>
  <script src="assets/js/monitoring.js"></script>
  <script src="assets/js/hasilnilai.js"></script>
  <script src="assets/js/cetak.js"></script>
  <script src="assets/js/randomizer.js"></script>
  <script src="assets/js/lockdown.js"></script>
  <script src="assets/js/autosave.js"></script>
  <script src="assets/js/ujian.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
